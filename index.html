<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KINGOO</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;touch-action:manipulation;user-select:none}.app{position:relative;width:100vw;height:100dvh;background:#000}.hud{position:absolute;z-index:20;top:0;left:0;right:0;height:58px;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;pointer-events:none}.brand{font-weight:950;color:#ff9b00;letter-spacing:.08em}.hudright{display:flex;gap:8px;align-items:center}.stage,.lives{font-size:13px;color:#aaa;background:#111;border:1px solid #252525;border-radius:999px;padding:8px 11px}.lives{color:#ff9b00;letter-spacing:.08em}.field{position:absolute;inset:58px 0 44px 0;overflow:hidden}.lion{position:absolute;object-fit:contain;transform-origin:center;cursor:pointer;-webkit-user-drag:none;will-change:left,top,opacity,transform}.hint{position:absolute;z-index:20;bottom:14px;left:50%;transform:translateX(-50%);font-size:13px;color:#777;white-space:nowrap;pointer-events:none}.overlay{position:absolute;inset:0;z-index:40;background:#000;display:grid;place-items:center;text-align:center;padding:24px}.hidden{display:none}.card{max-width:520px}.preview{width:150px;height:150px;object-fit:contain}h1{margin:8px 0 10px;font-size:clamp(52px,12vw,90px);line-height:.9;color:#ff9b00}p{color:#aaa;line-height:1.45}button{border:0;border-radius:999px;padding:15px 30px;background:#ff9b00;color:#000;font:inherit;font-weight:950;font-size:17px;cursor:pointer}.lose{background:#b40000}.lose h1,.lose p{color:#fff}.lose button{background:#fff;color:#b40000}
</style>
</head>
<body>
<div class="app">
  <div class="hud"><div class="brand">KINGOO</div><div class="hudright"><div class="lives" id="lives">●●●</div><div class="stage" id="stage">TABLEAU 1 / 300</div></div></div>
  <div class="field" id="field"></div>
  <div class="hint">Clique uniquement sur le lion orange.</div>
  <section class="overlay" id="start"><div class="card"><img src="assets/lion-orange.png" class="preview" alt="Kingoo"><h1>KINGOO</h1><p>Retrouve toujours le lion orange. Un nouveau lion rejoint chaque tableau. Tu as trois essais.</p><button id="play">JOUER</button></div></section>
  <section class="overlay hidden" id="win"><div class="card"><img src="assets/lion-orange.png" class="preview" alt="Kingoo"><h1>BRAVO !</h1><p>Tu as atteint le tableau 300.</p><button id="again">REJOUER</button></div></section>
  <section class="overlay lose hidden" id="lose"><div class="card"><h1>PERDU</h1><p>Trois erreurs. Retour au début.</p></div></section>
</div>
<script>
const MAX_LEVEL=300;
const field=document.getElementById('field');
const stage=document.getElementById('stage');
const livesEl=document.getElementById('lives');
const start=document.getElementById('start');
const win=document.getElementById('win');
const lose=document.getElementById('lose');
const play=document.getElementById('play');
const again=document.getElementById('again');
const orange='assets/lion-orange.png';
const filters=[
  'hue-rotate(338deg) saturate(1.8) brightness(1.05)',
  'hue-rotate(20deg) saturate(1.8) brightness(1.2)',
  'hue-rotate(70deg) saturate(1.7) brightness(1.1)',
  'hue-rotate(145deg) saturate(1.5) brightness(1.2)',
  'hue-rotate(195deg) saturate(1.9) brightness(1.1)',
  'hue-rotate(255deg) saturate(1.7) brightness(1.05)',
  'hue-rotate(305deg) saturate(1.4) brightness(1.1)',
  'sepia(.65) saturate(.7) brightness(1.4)',
  'grayscale(1) brightness(2.4)'
];
let level=1,lives=3,locked=false;
let motionRaf=0,fadeTimer=0,sceneId=0;
let lions=[];
function rand(min,max){return min+Math.random()*(max-min)}
function updateHud(){
  stage.textContent=`TABLEAU ${level} / ${MAX_LEVEL}`;
  livesEl.textContent='●'.repeat(lives)+'○'.repeat(3-lives);
}
function lionSize(){
  const r=field.getBoundingClientRect();
  const crowd=Math.max(0,level-10);
  const base=Math.min(124,Math.max(76,r.width*.16));
  return Math.max(22,base-crowd*.22);
}
function stopEffects(){
  cancelAnimationFrame(motionRaf);motionRaf=0;
  clearTimeout(fadeTimer);fadeTimer=0;
  sceneId++;
}
function place(img,i){
  const r=field.getBoundingClientRect();
  const size=lionSize();
  const x=rand(0,Math.max(1,r.width-size));
  const y=rand(0,Math.max(1,r.height-size));
  const rot=rand(-18,18);
  const scale=rand(.92,1.06);
  img.style.width=size+'px';img.style.height=size+'px';
  img.style.left=x+'px';img.style.top=y+'px';
  img.style.opacity='1';
  img.style.transform=`rotate(${rot}deg) scale(${scale})`;
  img.style.zIndex=i===0?'10000':String(Math.floor(rand(1,9000)));
  if(i>0) img.style.filter=filters[(i-1)%filters.length];
  img._state={x,y,vx:rand(-7,7),vy:rand(-7,7),rot,scale,size};
}
function makeLion(i){
  const img=new Image();
  img.src=orange;img.alt='lion';img.className='lion';img.dataset.target=i===0?'1':'0';
  const apply=()=>place(img,i);
  img.onload=apply;if(img.complete) apply();
  img.addEventListener('pointerdown',e=>{e.preventDefault();handle(i===0)});
  return img;
}
function startMotion(id){
  let last=performance.now();
  const tick=(now)=>{
    if(id!==sceneId || level<=50 || level>=100)return;
    const dt=Math.min(.04,(now-last)/1000);last=now;
    const r=field.getBoundingClientRect();
    for(const img of lions){
      const s=img._state;if(!s)continue;
      s.x+=s.vx*dt;s.y+=s.vy*dt;
      const maxX=Math.max(0,r.width-s.size),maxY=Math.max(0,r.height-s.size);
      if(s.x<=0||s.x>=maxX){s.vx*=-1;s.x=Math.max(0,Math.min(maxX,s.x))}
      if(s.y<=0||s.y>=maxY){s.vy*=-1;s.y=Math.max(0,Math.min(maxY,s.y))}
      img.style.left=s.x+'px';img.style.top=s.y+'px';
    }
    motionRaf=requestAnimationFrame(tick);
  };
  motionRaf=requestAnimationFrame(tick);
}
function startFades(id){
  const cycle=()=>{
    if(id!==sceneId || level<100)return;
    const choices=lions.slice(1); // Kingoo orange reste toujours visible.
    if(!choices.length)return;
    const img=choices[Math.floor(Math.random()*choices.length)];
    const outMs=rand(700,1500),hiddenMs=rand(120,900),inMs=rand(700,1500);
    img.style.transition=`opacity ${outMs}ms ease-in-out`;
    img.style.opacity='0';
    fadeTimer=setTimeout(()=>{
      if(id!==sceneId)return;
      img.style.transition=`opacity ${inMs}ms ease-in-out`;
      img.style.opacity='1';
      fadeTimer=setTimeout(cycle,rand(120,650));
    },outMs+hiddenMs);
  };
  fadeTimer=setTimeout(cycle,rand(250,800));
}
function draw(){
  stopEffects();locked=false;
  const id=sceneId;
  const frag=document.createDocumentFragment();
  lions=[];
  for(let i=0;i<level;i++){
    const img=makeLion(i);lions.push(img);frag.appendChild(img);
  }
  field.replaceChildren(frag);updateHud();
  if(level>50 && level<100) startMotion(id);
  else if(level>=100) startFades(id);
}
function nextLevel(){
  if(level>=MAX_LEVEL){
    stopEffects();locked=true;field.replaceChildren();win.classList.remove('hidden');return;
  }
  level++;draw();
}
function handle(ok){
  if(locked)return;
  if(ok){locked=true;nextLevel();return}
  lives--;updateHud();
  if(lives<=0){
    stopEffects();locked=true;field.replaceChildren();lose.classList.remove('hidden');
    setTimeout(()=>{lose.classList.add('hidden');begin()},1000);
  }
}
function begin(){
  stopEffects();level=1;lives=3;locked=false;
  start.classList.add('hidden');win.classList.add('hidden');lose.classList.add('hidden');draw();
}
play.onclick=begin;again.onclick=begin;
window.addEventListener('resize',()=>{if(start.classList.contains('hidden')&&win.classList.contains('hidden')&&lose.classList.contains('hidden'))draw()});
</script>
</body>
</html>

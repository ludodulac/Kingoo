<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KINGOO</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;touch-action:manipulation;user-select:none}.app{position:relative;width:100vw;height:100dvh;background:#000}.hud{position:absolute;z-index:20;top:0;left:0;right:0;height:58px;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;pointer-events:none}.brand{font-weight:950;color:#ff9b00;letter-spacing:.08em}.stage{font-size:13px;color:#aaa;background:#111;border:1px solid #252525;border-radius:999px;padding:8px 11px}.field{position:absolute;inset:58px 0 44px 0;overflow:hidden}.lion{position:absolute;width:112px;height:112px;object-fit:contain;transform-origin:center;cursor:pointer;-webkit-user-drag:none}.hint{position:absolute;z-index:20;bottom:14px;left:50%;transform:translateX(-50%);font-size:13px;color:#777;white-space:nowrap;pointer-events:none}.overlay{position:absolute;inset:0;z-index:40;background:#000;display:grid;place-items:center;text-align:center;padding:24px}.hidden{display:none}.card{max-width:520px}.preview{width:150px;height:150px;object-fit:contain}h1{margin:8px 0 10px;font-size:clamp(52px,12vw,90px);line-height:.9;color:#ff9b00}p{color:#aaa;line-height:1.45}button{border:0;border-radius:999px;padding:15px 30px;background:#ff9b00;color:#000;font:inherit;font-weight:950;font-size:17px;cursor:pointer}.flash{position:absolute;inset:0;z-index:30;background:#7a0000;opacity:0;pointer-events:none}.flash.on{animation:flash .18s}@keyframes flash{0%{opacity:.3}100%{opacity:0}}
</style>
</head>
<body>
<div class="app">
  <div class="hud"><div class="brand">KINGOO</div><div class="stage" id="stage">TABLEAU 1 / 10</div></div>
  <div class="field" id="field"></div>
  <div class="flash" id="flash"></div>
  <div class="hint">Clique uniquement sur le lion orange.</div>
  <section class="overlay" id="start"><div class="card"><img src="assets/lion-orange.png" class="preview" alt="Kingoo"><h1>KINGOO</h1><p>Retrouve toujours le lion orange. Un nouveau lion rejoint chaque tableau.</p><button id="play">JOUER</button></div></section>
  <section class="overlay hidden" id="win"><div class="card"><img src="assets/lion-orange.png" class="preview" alt="Kingoo"><h1>BRAVO !</h1><p>Tu as retrouvé Kingoo dans tous les tableaux.</p><button id="again">REJOUER</button></div></section>
</div>
<script>
const field=document.getElementById('field');
const stage=document.getElementById('stage');
const start=document.getElementById('start');
const win=document.getElementById('win');
const flash=document.getElementById('flash');
const play=document.getElementById('play');
const again=document.getElementById('again');
const orange='assets/lion-orange.png';
const filters=[
  'hue-rotate(338deg) saturate(1.8) brightness(1.05)',
  'hue-rotate(20deg) saturate(1.8) brightness(1.2)',
  'hue-rotate(70deg) saturate(1.7) brightness(1.1)',
  'hue-rotate(145deg) saturate(1.5) brightness(1.2)',
  'hue-rotate(195deg) saturate(1.9) brightness(1.1)',
  'hue-rotate(255deg) saturate(1.7) brightness(1.05)',
  'hue-rotate(305deg) saturate(1.4) brightness(1.1)',
  'sepia(.65) saturate(.7) brightness(1.4)',
  'grayscale(1) brightness(2.4)'
];
let level=1,items=[];
function rand(min,max){return min+Math.random()*(max-min)}
function place(img,i){
  const r=field.getBoundingClientRect();
  const size=Math.min(124,Math.max(78,r.width*.16));
  img.style.width=size+'px';img.style.height=size+'px';
  img.style.left=rand(0,Math.max(1,r.width-size))+'px';
  img.style.top=rand(0,Math.max(1,r.height-size))+'px';
  img.style.transform=`rotate(${rand(-16,16)}deg) scale(${rand(.9,1.08)})`;
  img.style.zIndex=String(Math.floor(rand(1,100)));
  if(i>0) img.style.filter=filters[(i-1)%filters.length];
}
function draw(){
  field.innerHTML='';items=[];stage.textContent=`TABLEAU ${level} / 10`;
  for(let i=0;i<level;i++){
    const img=new Image();img.src=orange;img.alt='lion';img.className='lion';img.dataset.target=i===0?'1':'0';
    img.onload=()=>place(img,i);
    if(img.complete) place(img,i);
    img.addEventListener('pointerdown',e=>{e.preventDefault();handle(img.dataset.target==='1')});
    field.appendChild(img);items.push(img);
  }
}
function handle(ok){
  if(ok){
    if(level>=10){field.innerHTML='';win.classList.remove('hidden');return}
    level++;draw();
  }else{
    flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on');
  }
}
function begin(){level=1;start.classList.add('hidden');win.classList.add('hidden');draw()}
play.onclick=begin;again.onclick=begin;
window.addEventListener('resize',()=>{if(start.classList.contains('hidden')&&win.classList.contains('hidden'))draw()});
</script>
</body>
</html>

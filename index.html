const COLORS=[null,'#910000','#fb5700','#f6d574','#5d971e','#4aacf6','#620ea5','#03afae','#c19b6d','#f8f8f8'];
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const stageEl=document.getElementById('stage'),flash=document.getElementById('flash'),start=document.getElementById('start'),win=document.getElementById('win');
const img=new Image();let sprites=[],alpha=null,objects=[],level=1,running=false,w=0,h=0,dpr=1;
img.src=ORIGINAL;document.getElementById('preview').src=ORIGINAL;document.getElementById('preview2').src=ORIGINAL;
function tintSprite(color){const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const x=c.getContext('2d');x.drawImage(img,0,0);if(color){x.globalCompositeOperation='source-in';x.fillStyle=color;x.fillRect(0,0,c.width,c.height)}return c}
function build(){sprites=COLORS.map(tintSprite);const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0);alpha=x.getImageData(0,0,c.width,c.height).data;resize()}
function rand(a,b){return a+Math.random()*(b-a)}function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function resize(){const r=canvas.getBoundingClientRect();w=Math.max(1,r.width);h=Math.max(1,r.height);dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(running)layout();else draw()}
function layout(){objects=[];const n=level,top=72,bottom=55,base=Math.min(w,h-top-bottom),size=Math.max(86,Math.min(210,base*(n<=3?.32:n<=6?.27:.23))),pad=size*.44,ids=[0,...Array.from({length:n-1},(_,i)=>i+1)],z=shuffle([...ids]);for(const id of ids){objects.push({id,x:rand(pad,Math.max(pad,w-pad)),y:rand(top+pad,Math.max(top+pad,h-bottom-pad)),size:size*rand(.90,1.08),rot:rand(-.12,.12),z:z.indexOf(id)})}objects.sort((a,b)=>a.z-b.z);stageEl.textContent=`TABLEAU ${level} / ${COLORS.length}`;draw()}
function dims(o){const ratio=img.width/img.height;let ww=o.size,hh=o.size;if(ratio>1)hh=ww/ratio;else ww=hh*ratio;return[ww,hh]}
function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);for(const o of objects){const [ww,hh]=dims(o);ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);ctx.drawImage(sprites[o.id],-ww/2,-hh/2,ww,hh);ctx.restore()}}
function alphaHit(o,px,py){const [ww,hh]=dims(o),dx=px-o.x,dy=py-o.y,c=Math.cos(-o.rot),s=Math.sin(-o.rot),lx=dx*c-dy*s,ly=dx*s+dy*c,u=lx/ww+.5,v=ly/hh+.5;if(u<0||u>=1||v<0||v>=1)return false;const ix=Math.max(0,Math.min(img.width-1,Math.floor(u*img.width))),iy=Math.max(0,Math.min(img.height-1,Math.floor(v*img.height)));return alpha[(iy*img.width+ix)*4+3]>45}
function clickAt(px,py){if(!running)return;let hit=null;for(let i=objects.length-1;i>=0;i--){if(alphaHit(objects[i],px,py)){hit=objects[i];break}}if(!hit)return;if(hit.id===0){if(level>=COLORS.length){running=false;win.classList.remove('hidden')}else{level++;layout()}}else{flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on')}}
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();clickAt(e.clientX-r.left,e.clientY-r.top)});
function begin(){level=1;running=true;start.classList.add('hidden');win.classList.add('hidden');layout()}
document.getElementById('play').onclick=begin;document.getElementById('again').onclick=begin;window.addEventListener('resize',resize);if(img.complete)build();else img.onload=build;
</script>

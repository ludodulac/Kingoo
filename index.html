<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>KINGOO</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;touch-action:manipulation;user-select:none}
  body{display:grid;place-items:center}
  .app{position:relative;width:min(100vw,900px);height:100dvh;background:#000;overflow:hidden}
  .top{position:absolute;inset:0 0 auto 0;z-index:5;height:64px;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;pointer-events:none}
  .brand{font-weight:950;letter-spacing:.08em;color:#ffad12;font-size:18px}
  .stage{font-size:13px;font-weight:800;color:#aaa;border:1px solid #262626;background:#0d0d0d;border-radius:999px;padding:8px 11px}
  canvas{display:block;width:100%;height:100%;background:#000}
  .hint{position:absolute;z-index:5;left:50%;bottom:18px;transform:translateX(-50%);white-space:nowrap;color:#777;font-size:13px;font-weight:700;pointer-events:none}
  .flash{position:absolute;inset:0;background:#8b0000;opacity:0;pointer-events:none;z-index:4}
  .flash.on{animation:flash .18s ease-out}
  @keyframes flash{0%{opacity:.28}100%{opacity:0}}
  .overlay{position:absolute;inset:0;z-index:10;display:grid;place-items:center;text-align:center;padding:28px;background:#000}
  .overlay.hidden{display:none}
  .card{max-width:520px}
  h1{margin:0 0 10px;color:#ffad12;font-size:clamp(48px,12vw,88px);line-height:.9;letter-spacing:-.06em}
  p{margin:0 auto 24px;color:#aaa;font-size:16px;line-height:1.45;max-width:420px}
  button{appearance:none;border:0;border-radius:999px;background:#ffad12;color:#000;font:inherit;font-weight:950;font-size:17px;padding:15px 30px;cursor:pointer}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top"><div class="brand">KINGOO</div><div class="stage" id="stage">TABLEAU 1</div></div>
  <canvas id="game"></canvas>
  <div class="flash" id="flash"></div>
  <div class="hint">Clique uniquement sur le lion orange.</div>
  <section class="overlay" id="start"><div class="card"><h1>KINGOO</h1><p>Retrouve toujours le lion orange. À chaque tableau, un nouveau lion coloré rejoint le jeu.</p><button id="play">JOUER</button></div></section>
  <section class="overlay hidden" id="win"><div class="card"><h1>BRAVO !</h1><p>Tu as retrouvé Kingoo dans tous les tableaux.</p><button id="again">REJOUER</button></div></section>
</div>
<script>
/* Les images originales sont injectées depuis des fichiers transparents convertis en sprites webp. */
const COLORS=['#ffad12','#b60000','#ff6500','#ffe07a','#6aae1a','#47a6e8','#6815b9','#0bb8b7','#d6b07b','#ffffff'];
const TARGET=0;
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const stageEl=document.getElementById('stage'),flash=document.getElementById('flash'),start=document.getElementById('start'),win=document.getElementById('win');
let level=1,running=false,objects=[],w=0,h=0,dpr=1;
function lionPath(c){return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 154" fill="none" stroke="${c}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 79c-13-3-18-15-10-24-8-10-3-22 8-26-1-13 10-21 22-17 7-12 22-13 32-4 10-9 26-7 32 4 13-4 24 5 22 18 12 4 16 17 8 26 8 10 3 22-9 25"/><path d="M27 80c0-23 7-39 17-50 9-10 19-8 30-4 11-4 22-6 31 4 10 11 17 27 17 50 0 37-19 60-48 60S27 117 27 80Z"/><path d="M42 67c3-8 9-8 12 0M92 67c3-8 9-8 12 0"/><ellipse cx="48" cy="77" rx="8" ry="6"/><ellipse cx="100" cy="77" rx="8" ry="6"/><ellipse cx="74" cy="80" rx="18" ry="14"/><path d="M67 77h14l-7 8Z" fill="${c}" stroke="none"/><path d="M74 85v7c0 9-14 9-14 0M74 92c0 9 14 9 14 0"/><path d="M38 95c18 2 20 15 14 24M110 95c-18 2-20 15-14 24M52 105c10-7 34-7 44 0"/><ellipse cx="47" cy="132" rx="16" ry="11"/><ellipse cx="101" cy="132" rx="16" ry="11"/><path d="M41 132v8M49 132v8M95 132v8M103 132v8M121 111c13 1 19-8 19-18 0-8 5-13 10-17 4 12 1 22-7 26-2 13-9 23-22 25"/></svg>`}
const sprites=COLORS.map(c=>{const im=new Image();im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(lionPath(c));return im});
function rand(a,b){return a+Math.random()*(b-a)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function resize(){const r=canvas.getBoundingClientRect();w=r.width;h=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(running)layout();else draw()}
function layout(){objects=[];const n=level,top=72,bottom=55,base=Math.min(w,h-top-bottom),size=Math.max(80,Math.min(190,base*(n<=3?.3:n<=6?.25:.21))),pad=size*.38,ids=[0,...Array.from({length:n-1},(_,i)=>i+1)],z=shuffle([...ids]);ids.forEach(id=>objects.push({id,x:rand(pad,Math.max(pad,w-pad)),y:rand(top+pad,Math.max(top+pad,h-bottom-pad)),size:size*rand(.9,1.08),rot:rand(-.12,.12),z:z.indexOf(id)}));objects.sort((a,b)=>a.z-b.z);stageEl.textContent=`TABLEAU ${level} / ${COLORS.length}`;draw()}
function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);for(const o of objects){const im=sprites[o.id];ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);ctx.drawImage(im,-o.size/2,-o.size/2,o.size,o.size);ctx.restore()}}
function hit(o,x,y){const dx=x-o.x,dy=y-o.y,c=Math.cos(-o.rot),s=Math.sin(-o.rot),lx=dx*c-dy*s,ly=dx*s+dy*c;return Math.abs(lx)<o.size*.42&&Math.abs(ly)<o.size*.46&&Math.hypot(lx,ly)<o.size*.52}
function clickAt(x,y){if(!running)return;let o=null;for(let i=objects.length-1;i>=0;i--)if(hit(objects[i],x,y)){o=objects[i];break}if(!o)return;if(o.id===TARGET){if(level===COLORS.length){running=false;win.classList.remove('hidden')}else{level++;layout()}}else{flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on')}}
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();clickAt(e.clientX-r.left,e.clientY-r.top)});
function begin(){level=1;running=true;start.classList.add('hidden');win.classList.add('hidden');layout()}
document.getElementById('play').onclick=begin;document.getElementById('again').onclick=begin;window.addEventListener('resize',resize);Promise.all(sprites.map(im=>new Promise(ok=>{if(im.complete)ok();else im.onload=ok}))).then(resize);
</script>
</body>
</html>

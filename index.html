<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>KINGOO</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;touch-action:manipulation;user-select:none}.app{position:relative;width:100vw;height:100dvh;background:#000}.hud{position:absolute;z-index:12000;top:0;left:0;right:0;height:58px;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;pointer-events:none}.brand{font-weight:950;color:#ff9b00;letter-spacing:.08em}.hudright{display:flex;gap:8px}.stage,.lives{font-size:13px;color:#aaa;background:#111;border:1px solid #252525;border-radius:999px;padding:8px 11px}.lives{color:#ff9b00}.objective{position:absolute;z-index:12001;top:62px;left:12px;padding:7px 10px;border-radius:999px;background:rgba(0,0,0,.72);border:1px solid #2c2c2c;color:#fff;font-size:12px;font-weight:950;letter-spacing:.05em;pointer-events:none}.field{position:absolute;inset:58px 0 44px;overflow:hidden}.lion{position:absolute;object-fit:contain;transform-origin:center;cursor:pointer;-webkit-user-drag:none;will-change:left,top,opacity,transform}.hint{position:absolute;z-index:12000;bottom:14px;left:50%;transform:translateX(-50%);font-size:13px;color:#777;white-space:nowrap;pointer-events:none}.overlay{position:absolute;inset:0;z-index:40000;background:#000;display:grid;place-items:center;text-align:center;padding:24px}.hidden{display:none}.card{max-width:520px}.preview{width:150px;height:150px;object-fit:contain}h1{margin:8px 0 10px;font-size:clamp(52px,12vw,90px);line-height:.9;color:#ff9b00}p{color:#aaa;line-height:1.45}button{border:0;border-radius:999px;padding:15px 30px;background:#ff9b00;color:#000;font:inherit;font-weight:950;font-size:17px;cursor:pointer}.lose{background:#b40000}.lose h1,.lose p{color:#fff}.scoreline{font-size:19px;font-weight:900;color:#fff;margin:7px 0}.palms{position:absolute;left:8px;bottom:42px;z-index:52000;display:flex;align-items:flex-end;flex-wrap:wrap;gap:3px;max-width:78vw;pointer-events:none}.palm-badge{position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:flex-end;width:34px;min-height:43px;animation:palmPop .35s ease both;filter:drop-shadow(0 2px 2px #000)}.palm-level{font-size:10px;font-weight:950;line-height:1;color:#fff;text-shadow:0 1px 3px #000;margin-bottom:1px}.palm-mark{font-size:29px;line-height:.82}@keyframes palmPop{0%{opacity:0;transform:scale(.2) translateY(15px)}75%{transform:scale(1.18) translateY(-2px)}100%{opacity:1;transform:scale(1) translateY(0)}}.bravo-pop{position:absolute;left:50%;bottom:76px;z-index:53000;transform:translateX(-50%);background:#167a36;border:2px solid #7cff9d;border-radius:14px;padding:8px 14px;font-size:16px;font-weight:950;letter-spacing:.08em;color:#fff;opacity:0;pointer-events:none;white-space:nowrap}.bravo-pop.show{animation:bravoPop 1.15s ease both}@keyframes bravoPop{0%{opacity:0;transform:translate(-50%,10px) scale(.86)}14%,70%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-6px) scale(.96)}}.storm{position:fixed;top:68px;left:50%;z-index:999999;transform:translateX(-50%);background:#202842;border:2px solid #b8c0ff;border-radius:999px;padding:11px 18px;font-size:16px;font-weight:950;letter-spacing:.03em;white-space:nowrap;opacity:0;pointer-events:none;box-shadow:0 5px 24px #000;text-shadow:0 1px 2px #000}.storm.show{animation:storm 2s ease both}@keyframes storm{0%{opacity:0;transform:translate(-50%,-12px) scale(.9)}8%,84%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-5px) scale(.98)}}.confetti{position:absolute;top:-18px;z-index:51000;width:8px;height:14px;pointer-events:none;animation:fall var(--dur) linear forwards}@keyframes fall{0%{opacity:1;transform:translate3d(0,0,0) rotate(0)}100%{opacity:0;transform:translate3d(var(--drift),105vh,0) rotate(var(--spin))}}.black-cut{position:absolute;inset:0;z-index:35000;background:#000;opacity:0;pointer-events:none}.black-cut.on{opacity:1}
</style></head>
<body><div class="app" id="app"><div class="hud"><div class="brand">KINGOO</div><div class="hudright"><div class="lives" id="lives">●●●</div><div class="stage" id="stage">TABLEAU 1 / 300</div></div></div><div class="objective" id="objective">OBJECTIF 25</div><div class="field" id="field"></div><div class="hint">Clique uniquement sur le lion orange.</div><div class="palms" id="palms"></div><div class="bravo-pop" id="bravoPop">BRAVO !</div><div class="storm" id="storm">⛈️ IL Y A DE L’ORAGE</div><div class="black-cut" id="blackCut"></div><section class="overlay" id="start"><div class="card"><img src="assets/lion-orange.png" class="preview"><h1>KINGOO</h1><p>Retrouve toujours le lion orange. Un nouveau lion rejoint chaque tableau. Tu as trois essais.</p><button id="play">JOUER</button></div></section><section class="overlay hidden" id="win"><div class="card"><img src="assets/lion-orange.png" class="preview"><h1>BRAVO !</h1><p>Tu as atteint le tableau 300.</p><p class="scoreline" id="winTime"></p><button id="again">REJOUER</button></div></section><section class="overlay lose hidden" id="lose"><div class="card"><h1>PERDU</h1><p class="scoreline" id="loseScore"></p><p class="scoreline" id="loseTime"></p><button id="retry">RECOMMENCER</button></div></section></div>
<script>
const MAX_LEVEL=300;const app=document.getElementById('app'),field=document.getElementById('field'),stage=document.getElementById('stage'),livesEl=document.getElementById('lives'),objective=document.getElementById('objective'),start=document.getElementById('start'),win=document.getElementById('win'),lose=document.getElementById('lose'),play=document.getElementById('play'),again=document.getElementById('again'),retry=document.getElementById('retry'),palms=document.getElementById('palms'),bravoPop=document.getElementById('bravoPop'),storm=document.getElementById('storm'),blackCut=document.getElementById('blackCut'),loseScore=document.getElementById('loseScore'),loseTime=document.getElementById('loseTime'),winTime=document.getElementById('winTime');const orange='assets/lion-orange.png';const filters=['hue-rotate(338deg) saturate(1.8)','hue-rotate(20deg) saturate(1.8)','hue-rotate(70deg) saturate(1.7)','hue-rotate(145deg) saturate(1.5)','hue-rotate(195deg) saturate(1.9)','hue-rotate(255deg) saturate(1.7)','hue-rotate(305deg) saturate(1.4)','sepia(.65) saturate(.7) brightness(1.4)','grayscale(1) brightness(2.4)'];let level=1,lives=3,locked=false,motionRaf=0,sceneId=0,lions=[],blinkTimers=[],coverPair=null,celebrated=new Set(),stormShown=new Set(),audioCtx=null,startTime=0;const rand=(a,b)=>a+Math.random()*(b-a);
function isBlink(n){if(n>=36&&n<=40)return true;if(n<61)return false;return((n-61)%15)<5}function isMilestone(n){return n===26||n===36||n===41||(n>=61&&(((n-61)%15)===0||((n-61)%15)===5))}function isBlinkStart(n){return n===36||(n>=61&&((n-61)%15)===0)}function milestoneLabel(n){if(n===26)return 25;if(n===36)return 35;if(n===41)return 40;return n-1}function objectiveFor(n){if(n<=25)return 25;if(n<=35)return 35;if(n<=40)return 40;if(n<=60)return 60;const offset=(n-61)%15;const base=n-offset;return offset<5?base+4:base+14}function updateHud(){stage.textContent=`TABLEAU ${level} / 300`;livesEl.textContent='●'.repeat(lives)+'○'.repeat(3-lives);objective.textContent='OBJECTIF '+Math.min(300,objectiveFor(level))}function elapsed(){return Math.max(0,performance.now()-startTime)}function formatTime(ms){const total=Math.floor(ms/1000),m=Math.floor(total/60),s=total%60;return `${m} min ${String(s).padStart(2,'0')} s`}function lionSize(){const r=field.getBoundingClientRect(),base=Math.min(124,Math.max(76,r.width*.16));return Math.max(22,base-Math.max(0,level-10)*.22)}function stopEffects(){cancelAnimationFrame(motionRaf);motionRaf=0;blinkTimers.forEach(clearTimeout);blinkTimers=[];coverPair=null;sceneId++}
function place(img,i){const r=field.getBoundingClientRect(),size=lionSize(),x=rand(0,Math.max(1,r.width-size)),y=rand(0,Math.max(1,r.height-size));img.style.width=size+'px';img.style.height=size+'px';img.style.left=x+'px';img.style.top=y+'px';img.style.opacity='1';img.style.transform=`rotate(${rand(-18,18)}deg) scale(${rand(.92,1.06)})`;img.style.zIndex=i===0?'10000':String(Math.floor(rand(1,9000)));if(i>0)img.style.filter=filters[(i-1)%filters.length];img._state={x,y,vx:rand(-7,7),vy:rand(-7,7),size}}function makeLion(i){const img=new Image();img.src=orange;img.className='lion';place(img,i);img.addEventListener('pointerdown',e=>{e.preventDefault();handle(i===0)});return img}
function cover(){if(level<41||lions.length<2)return;const t=lions[0],ts=t._state;if(!ts)return;const available=Math.min(filters.length,lions.length-1),ci=1+((level-41)%available),c=lions[ci],cs=c._state;if(!cs)return;const dx=ts.size*.42*(level%2?1:-1),dy=ts.size*.18*(level%3?1:-1);t.style.zIndex='6000';c.style.zIndex='7000';for(let i=1;i<lions.length;i++)if(i!==ci)lions[i].style.zIndex=String(Math.floor(rand(1,5500)));coverPair={target:t,cover:c,dx,dy};syncCover()}function syncCover(){if(!coverPair)return;const {target,cover,dx,dy}=coverPair,ts=target._state,cs=cover._state,r=field.getBoundingClientRect();if(!ts||!cs)return;cs.x=Math.max(0,Math.min(r.width-cs.size,ts.x+dx));cs.y=Math.max(0,Math.min(r.height-cs.size,ts.y+dy));cover.style.left=cs.x+'px';cover.style.top=cs.y+'px'}
function motion(id){let last=performance.now();const tick=now=>{if(id!==sceneId||isBlink(level))return;const moving=(level>=26&&level<=35)||level>=41;if(!moving)return;const dt=Math.min(.04,(now-last)/1000);last=now,r=field.getBoundingClientRect();for(const img of lions){if(coverPair&&img===coverPair.cover)continue;const s=img._state;if(!s)continue;s.x+=s.vx*dt;s.y+=s.vy*dt;const mx=Math.max(0,r.width-s.size),my=Math.max(0,r.height-s.size);if(s.x<=0||s.x>=mx){s.vx*=-1;s.x=Math.max(0,Math.min(mx,s.x))}if(s.y<=0||s.y>=my){s.vy*=-1;s.y=Math.max(0,Math.min(my,s.y))}img.style.left=s.x+'px';img.style.top=s.y+'px'}syncCover();motionRaf=requestAnimationFrame(tick)};motionRaf=requestAnimationFrame(tick)}
function blinking(id){for(const img of lions){const blink=()=>{if(id!==sceneId||!isBlink(level))return;const t1=setTimeout(()=>{if(id!==sceneId)return;img.style.opacity='0';const t2=setTimeout(()=>{if(id!==sceneId)return;img.style.opacity='1';const t3=setTimeout(blink,rand(80,400));blinkTimers.push(t3)},rand(100,260));blinkTimers.push(t2)},rand(140,480));blinkTimers.push(t1)};blinkTimers.push(setTimeout(blink,rand(0,500)))}}
function tone(freq,dur=.25,vol=.1,type='sine'){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const n=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,n);g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(.0001,n+dur);o.connect(g);g.connect(audioCtx.destination);o.start(n);o.stop(n+dur)}catch(e){}}function ding(){tone(1100,.28,.12,'sine')}function thunder(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const n=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sawtooth';o.frequency.setValueAtTime(100,n);o.frequency.exponentialRampToValueAtTime(38,n+.55);g.gain.setValueAtTime(.11,n);g.gain.exponentialRampToValueAtTime(.0001,n+.6);o.connect(g);g.connect(audioCtx.destination);o.start(n);o.stop(n+.61)}catch(e){}}
function confetti(){const colors=['#ff9b00','#fff','#24d8c8','#ff4d6d','#58df65','#39a9ff','#ffd21c'];for(let i=0;i<36;i++){const c=document.createElement('i');c.className='confetti';c.style.left=rand(2,98)+'%';c.style.background=colors[i%colors.length];c.style.setProperty('--dur',rand(.8,1.5)+'s');c.style.setProperty('--drift',rand(-90,90)+'px');c.style.setProperty('--spin',rand(300,1000)+'deg');app.appendChild(c);setTimeout(()=>c.remove(),1700)}}function addPalm(label){const b=document.createElement('span');b.className='palm-badge';const l=document.createElement('span');l.className='palm-level';l.textContent=label;const p=document.createElement('span');p.className='palm-mark';p.textContent='🌴';b.append(l,p);palms.appendChild(b)}function celebrate(){if(!isMilestone(level)||celebrated.has(level))return;celebrated.add(level);addPalm(milestoneLabel(level));bravoPop.classList.remove('show');void bravoPop.offsetWidth;bravoPop.classList.add('show');ding();confetti()}function stormAlert(){if(!isBlinkStart(level)||stormShown.has(level))return;stormShown.add(level);storm.textContent='⛈️ IL Y A DE L’ORAGE';storm.classList.remove('show');void storm.offsetWidth;storm.classList.add('show');thunder()}
function draw(){stopEffects();locked=false;const id=sceneId,frag=document.createDocumentFragment();lions=[];for(let i=0;i<level;i++){const img=makeLion(i);lions.push(img);frag.appendChild(img)}field.replaceChildren(frag);updateHud();requestAnimationFrame(()=>{if(id!==sceneId)return;if(level>=41)cover();if(isBlink(level))blinking(id);else if((level>=26&&level<=35)||level>=41)motion(id);celebrate();stormAlert()})}
function next(){if(level>=300){stopEffects();locked=true;field.replaceChildren();winTime.textContent='Temps : '+formatTime(elapsed());win.classList.remove('hidden');return}stopEffects();blackCut.classList.add('on');field.replaceChildren();level++;updateHud();setTimeout(()=>{draw();requestAnimationFrame(()=>requestAnimationFrame(()=>blackCut.classList.remove('on')))},45)}function handle(ok){if(locked)return;if(ok){locked=true;next();return}lives--;updateHud();if(lives<=0){stopEffects();locked=true;field.replaceChildren();loseScore.textContent='Score : '+Math.max(0,level-1)+' tableaux réussis';loseTime.textContent='Temps : '+formatTime(elapsed());lose.classList.remove('hidden')}}function begin(){stopEffects();level=1;lives=3;locked=false;startTime=performance.now();celebrated=new Set();stormShown=new Set();palms.replaceChildren();start.classList.add('hidden');win.classList.add('hidden');lose.classList.add('hidden');blackCut.classList.remove('on');field.replaceChildren();updateHud();requestAnimationFrame(draw)}play.onclick=()=>{ding();begin()};again.onclick=begin;retry.onclick=begin;window.addEventListener('resize',()=>{if(start.classList.contains('hidden')&&win.classList.contains('hidden')&&lose.classList.contains('hidden'))draw()});
</script></body></html>

<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>KINGOO</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;touch-action:manipulation;user-select:none}.app{position:relative;width:100vw;height:100dvh;background:#000}.hud{position:absolute;z-index:20;top:0;left:0;right:0;height:58px;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;pointer-events:none}.brand{font-weight:950;color:#ff9b00;letter-spacing:.08em}.hudright{display:flex;gap:8px}.stage,.lives{font-size:13px;color:#aaa;background:#111;border:1px solid #252525;border-radius:999px;padding:8px 11px}.lives{color:#ff9b00}.field{position:absolute;inset:58px 0 44px;overflow:hidden}.lion{position:absolute;object-fit:contain;transform-origin:center;cursor:pointer;-webkit-user-drag:none;will-change:left,top,opacity,transform}.hint{position:absolute;z-index:20;bottom:14px;left:50%;transform:translateX(-50%);font-size:13px;color:#777;white-space:nowrap;pointer-events:none}.overlay{position:absolute;inset:0;z-index:40;background:#000;display:grid;place-items:center;text-align:center;padding:24px}.hidden{display:none}.card{max-width:520px}.preview{width:150px;height:150px;object-fit:contain}h1{margin:8px 0 10px;font-size:clamp(52px,12vw,90px);line-height:.9;color:#ff9b00}p{color:#aaa;line-height:1.45}button{border:0;border-radius:999px;padding:15px 30px;background:#ff9b00;color:#000;font:inherit;font-weight:950;font-size:17px;cursor:pointer}.lose{background:#b40000}.lose h1,.lose p{color:#fff}.milestone{position:absolute;left:14px;bottom:48px;z-index:100;display:flex;align-items:center;gap:10px;background:#167a36;border:2px solid #7cff9d;border-radius:18px;padding:9px 14px 9px 9px;opacity:0;transform:translateY(15px) scale(.85);pointer-events:none;box-shadow:0 4px 20px #000}.milestone.show{animation:milestone 1.35s ease both}.palm{font-size:42px;line-height:1}.bravo{font-size:17px;font-weight:950;letter-spacing:.08em;color:#fff}@keyframes milestone{0%{opacity:0;transform:translateY(15px) scale(.85)}12%,78%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-8px) scale(.96)}}.confetti{position:absolute;top:-18px;z-index:99;width:8px;height:14px;pointer-events:none;animation:fall var(--dur) linear forwards}@keyframes fall{0%{opacity:1;transform:translate3d(0,0,0) rotate(0)}100%{opacity:0;transform:translate3d(var(--drift),105vh,0) rotate(var(--spin))}}</style></head>
<body><div class="app" id="app"><div class="hud"><div class="brand">KINGOO</div><div class="hudright"><div class="lives" id="lives">●●●</div><div class="stage" id="stage">TABLEAU 1 / 300</div></div></div><div class="field" id="field"></div><div class="hint">Clique uniquement sur le lion orange.</div><div class="milestone" id="milestone"><span class="palm">🌴</span><span class="bravo">BRAVO !</span></div><section class="overlay" id="start"><div class="card"><img src="assets/lion-orange.png" class="preview"><h1>KINGOO</h1><p>Retrouve toujours le lion orange. Un nouveau lion rejoint chaque tableau. Tu as trois essais.</p><button id="play">JOUER</button></div></section><section class="overlay hidden" id="win"><div class="card"><img src="assets/lion-orange.png" class="preview"><h1>BRAVO !</h1><p>Tu as atteint le tableau 300.</p><button id="again">REJOUER</button></div></section><section class="overlay lose hidden" id="lose"><div class="card"><h1>PERDU</h1><p>Trois erreurs. Retour au début.</p></div></section></div>
<script>
const MAX_LEVEL=300;const app=document.getElementById('app'),field=document.getElementById('field'),stage=document.getElementById('stage'),livesEl=document.getElementById('lives'),start=document.getElementById('start'),win=document.getElementById('win'),lose=document.getElementById('lose'),play=document.getElementById('play'),again=document.getElementById('again'),milestone=document.getElementById('milestone');const orange='assets/lion-orange.png';const filters=['hue-rotate(338deg) saturate(1.8)','hue-rotate(20deg) saturate(1.8)','hue-rotate(70deg) saturate(1.7)','hue-rotate(145deg) saturate(1.5)','hue-rotate(195deg) saturate(1.9)','hue-rotate(255deg) saturate(1.7)','hue-rotate(305deg) saturate(1.4)','sepia(.65) saturate(.7) brightness(1.4)','grayscale(1) brightness(2.4)'];let level=1,lives=3,locked=false,motionRaf=0,sceneId=0,lions=[],blinkTimers=[],coverPair=null,celebrated=new Set(),audioCtx=null;const rand=(a,b)=>a+Math.random()*(b-a);
function updateHud(){stage.textContent=`TABLEAU ${level} / 300`;livesEl.textContent='●'.repeat(lives)+'○'.repeat(3-lives)}function lionSize(){const r=field.getBoundingClientRect(),base=Math.min(124,Math.max(76,r.width*.16));return Math.max(22,base-Math.max(0,level-10)*.22)}function stopEffects(){cancelAnimationFrame(motionRaf);motionRaf=0;blinkTimers.forEach(clearTimeout);blinkTimers=[];coverPair=null;sceneId++}function isBlink(n){if(n>=36&&n<=40)return true;if(n<61)return false;return((n-61)%15)<5}function isMilestone(n){return n===26||n===36||n===41||(n>=61&&(((n-61)%15)===0||((n-61)%15)===5))}
function place(img,i){const r=field.getBoundingClientRect(),size=lionSize(),x=rand(0,Math.max(1,r.width-size)),y=rand(0,Math.max(1,r.height-size));img.style.width=size+'px';img.style.height=size+'px';img.style.left=x+'px';img.style.top=y+'px';img.style.opacity='1';img.style.transform=`rotate(${rand(-18,18)}deg) scale(${rand(.92,1.06)})`;img.style.zIndex=i===0?'10000':String(Math.floor(rand(1,9000)));if(i>0)img.style.filter=filters[(i-1)%filters.length];img._state={x,y,vx:rand(-7,7),vy:rand(-7,7),size}}function makeLion(i){const img=new Image();img.src=orange;img.className='lion';const apply=()=>place(img,i);img.onload=apply;if(img.complete)apply();img.addEventListener('pointerdown',e=>{e.preventDefault();handle(i===0)});return img}
function cover(){if(level<41||lions.length<2)return;const t=lions[0],ts=t._state;if(!ts)return;const available=Math.min(filters.length,lions.length-1),ci=1+((level-41)%available),c=lions[ci],cs=c._state;if(!cs)return;const dx=ts.size*.42*(level%2?1:-1),dy=ts.size*.18*(level%3?1:-1);t.style.zIndex='6000';c.style.zIndex='7000';for(let i=1;i<lions.length;i++)if(i!==ci)lions[i].style.zIndex=String(Math.floor(rand(1,5500)));coverPair={target:t,cover:c,dx,dy};syncCover()}function syncCover(){if(!coverPair)return;const {target,cover,dx,dy}=coverPair,ts=target._state,cs=cover._state,r=field.getBoundingClientRect();if(!ts||!cs)return;cs.x=Math.max(0,Math.min(r.width-cs.size,ts.x+dx));cs.y=Math.max(0,Math.min(r.height-cs.size,ts.y+dy));cover.style.left=cs.x+'px';cover.style.top=cs.y+'px'}
function motion(id){let last=performance.now();const tick=now=>{if(id!==sceneId||isBlink(level))return;const moving=(level>=26&&level<=35)||level>=41;if(!moving)return;const dt=Math.min(.04,(now-last)/1000);last=now,r=field.getBoundingClientRect();for(const img of lions){if(coverPair&&img===coverPair.cover)continue;const s=img._state;if(!s)continue;s.x+=s.vx*dt;s.y+=s.vy*dt;const mx=Math.max(0,r.width-s.size),my=Math.max(0,r.height-s.size);if(s.x<=0||s.x>=mx){s.vx*=-1;s.x=Math.max(0,Math.min(mx,s.x))}if(s.y<=0||s.y>=my){s.vy*=-1;s.y=Math.max(0,Math.min(my,s.y))}img.style.left=s.x+'px';img.style.top=s.y+'px'}syncCover();motionRaf=requestAnimationFrame(tick)};motionRaf=requestAnimationFrame(tick)}
function blinking(id){for(const img of lions){const blink=()=>{if(id!==sceneId||!isBlink(level))return;const t1=setTimeout(()=>{if(id!==sceneId)return;img.style.opacity='0';const t2=setTimeout(()=>{if(id!==sceneId)return;img.style.opacity='1';const t3=setTimeout(blink,rand(80,400));blinkTimers.push(t3)},rand(100,260));blinkTimers.push(t2)},rand(140,480));blinkTimers.push(t1)};blinkTimers.push(setTimeout(blink,rand(0,500)))}}
function ding(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const n=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.setValueAtTime(880,n);o.frequency.exponentialRampToValueAtTime(1320,n+.14);g.gain.setValueAtTime(.12,n);g.gain.exponentialRampToValueAtTime(.0001,n+.3);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(n+.31)}catch(e){}}function confetti(){const colors=['#ff9b00','#fff','#24d8c8','#ff4d6d','#58df65','#39a9ff','#ffd21c'];for(let i=0;i<40;i++){const c=document.createElement('i');c.className='confetti';c.style.left=rand(2,98)+'%';c.style.background=colors[i%colors.length];c.style.setProperty('--dur',rand(.8,1.5)+'s');c.style.setProperty('--drift',rand(-90,90)+'px');c.style.setProperty('--spin',rand(300,1000)+'deg');app.appendChild(c);setTimeout(()=>c.remove(),1700)}}function celebrate(){if(!isMilestone(level)||celebrated.has(level))return;celebrated.add(level);milestone.classList.remove('show');void milestone.offsetWidth;milestone.classList.add('show');ding();confetti()}
function draw(){stopEffects();locked=false;const id=sceneId,frag=document.createDocumentFragment();lions=[];for(let i=0;i<level;i++){const img=makeLion(i);lions.push(img);frag.appendChild(img)}field.replaceChildren(frag);updateHud();requestAnimationFrame(()=>{if(id!==sceneId)return;if(level>=41)cover();if(isBlink(level))blinking(id);else if((level>=26&&level<=35)||level>=41)motion(id);celebrate()})}function next(){if(level>=300){stopEffects();locked=true;field.replaceChildren();win.classList.remove('hidden');return}stopEffects();field.replaceChildren();level++;requestAnimationFrame(()=>requestAnimationFrame(draw))}function handle(ok){if(locked)return;if(ok){locked=true;next();return}lives--;updateHud();if(lives<=0){stopEffects();locked=true;field.replaceChildren();lose.classList.remove('hidden');setTimeout(()=>{lose.classList.add('hidden');begin()},1000)}}function begin(){stopEffects();level=1;lives=3;locked=false;celebrated=new Set();start.classList.add('hidden');win.classList.add('hidden');lose.classList.add('hidden');field.replaceChildren();requestAnimationFrame(draw)}play.onclick=()=>{ding();begin()};again.onclick=begin;window.addEventListener('resize',()=>{if(start.classList.contains('hidden')&&win.classList.contains('hidden')&&lose.classList.contains('hidden'))draw()});
</script></body></html>

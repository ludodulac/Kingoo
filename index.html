<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>KINGOO</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui;overflow:hidden;user-select:none}.app{height:100dvh;display:flex;flex-direction:column;padding:10px;max-width:1000px;margin:auto}.hud{height:55px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:1000;font-size:24px;color:#ff7900}.stats{display:flex;gap:7px}.p{padding:8px 10px;border:1px solid #292929;border-radius:999px;background:#111;font-weight:800}.game{position:relative;flex:1;border:1px solid #171717;border-radius:24px;overflow:hidden}.field{position:absolute;inset:8px}.a{position:absolute;width:90px;height:90px;display:grid;place-items:center;cursor:pointer}.a svg{width:100%;height:100%;overflow:visible}.bar{position:absolute;z-index:3;top:0;left:0;width:100%;height:4px;background:#ff7900;transform-origin:left}.flash{position:absolute;inset:0;background:#f22;opacity:0;pointer-events:none}.flash.on{animation:f .25s}@keyframes f{50%{opacity:.3}}.foot{height:45px;display:grid;place-items:center;color:#777;font-weight:700}.ov{position:absolute;inset:0;background:#000;z-index:10;display:grid;place-items:center;text-align:center;padding:25px}.hide{display:none}.title{font-size:70px;color:#ff7900;font-weight:1000;letter-spacing:-5px;margin:10px}.btn{border:0;border-radius:999px;background:#ff7900;padding:16px 34px;font-size:18px;font-weight:1000}.hero{width:170px;color:#ff7900}</style></head><body><div class="app"><header class="hud"><b class="brand">KINGOO</b><div class="stats"><span class="p" id="lv">NIV. 1</span><span class="p" id="tm">3.0 s</span><span class="p" id="li">●●●</span></div></header><main class="game"><i class="bar" id="bar"></i><div class="field" id="field"></div><div class="flash" id="flash"></div></main><div class="foot">Trouve Kingoo : le lion orange.</div><section class="ov" id="start"><div><div class="hero" id="hero"></div><h1 class="title">KINGOO</h1><p>Repère le lion orange avant la fin du chrono.</p><button class="btn" id="play">JOUER</button></div></section><section class="ov hide" id="over"><div><h1 class="title" id="score">1</h1><p id="sum"></p><button class="btn" id="again">REJOUER</button></div></section></div><script>const S=`<svg viewBox="0 0 160 160" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M49 31c-9-13-27-9-28 6-13 4-16 21-5 29-8 10-2 25 10 27-2 13 9 23 22 19 7 11 23 13 32 4 10 9 26 7 32-4 14 4 24-7 22-20 13-3 18-18 10-28 11-9 7-25-6-29-1-15-19-19-28-6-8-8-21-6-30 1-9-7-22-7-31 1Z"/><path d="M45 54c0-12 10-21 22-18l13 5 13-5c12-3 22 6 22 18l-3 10c8 10 13 23 13 38 0 28-18 42-45 42s-45-14-45-42c0-15 5-28 13-38Z"/><path d="M59 84c3-7 9-7 12 0M89 84c3-7 9-7 12 0"/><ellipse cx="80" cy="98" rx="19" ry="15"/><path d="M73 96h14l-7 7Z" fill="currentColor"/></svg>`;hero.innerHTML=S;const C=['#ff5b61','#c61f32','#ffd21c','#58df65','#39a9ff','#1769e8','#b75cff','#f2d1a0','#c98d54','#71432d','#22d9d2','#c9cbd1','#676a73'];let level=1,lives=3,run=0,end=0,startT=0,raf=0,hits=0;function draw(){cancelAnimationFrame(raf);field.innerHTML='';let n=Math.min(level,C.length+1),r=field.getBoundingClientRect(),pts=[];for(let i=0;i<n;i++){let d=document.createElement('div'),ok=0,x,y;d.className='a';for(let k=0;k<80&&!ok;k++){x=Math.random()*Math.max(1,r.width-90);y=Math.random()*Math.max(1,r.height-90);ok=pts.every(p=>Math.hypot(p.x-x,p.y-y)>75)}pts.push({x,y});d.style.left=x+'px';d.style.top=y+'px';d.style.color=i?' '+C[i-1]:'#ff7900';d.style.color=i?C[i-1]:'#ff7900';d.innerHTML=S;d.onclick=()=>i?miss():hit();field.append(d)}let ms=Math.max(900,3000-level*80);startT=performance.now();end=startT+ms;tick()}function tick(){if(!run)return;let q=end-performance.now(),full=end-startT;tm.textContent=(Math.max(0,q)/1000).toFixed(1)+' s';bar.style.transform='scaleX('+Math.max(0,q/full)+')';if(q<=0)return miss();raf=requestAnimationFrame(tick)}function up(){lv.textContent='NIV. '+level;li.textContent='●'.repeat(lives)+'○'.repeat(3-lives)}function hit(){if(!run)return;level++;lives=3;hits++;up();draw()}function miss(){if(!run)return;cancelAnimationFrame(raf);lives--;up();flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on');if(lives<1)setTimeout(done,250);else setTimeout(draw,300)}function begin(){level=1;lives=3;hits=0;run=1;start.classList.add('hide');over.classList.add('hide');up();draw()}function done(){run=0;field.innerHTML='';score.textContent=level;sum.textContent='Niveau '+level+' · '+hits+' bons clics';over.classList.remove('hide')}play.onclick=begin;again.onclick=begin;</script></body></html>
